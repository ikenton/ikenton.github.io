<!DOCTYPE html>

<body class="pagePadding" style="background-color: #e6d7ff;">

    <head>
        <link rel="stylesheet" href="stylesheet.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            .grid-container {
                display: grid;
                grid-template-columns: auto auto auto;

                padding: 10px;
            }

            .grid-item {
                border: 1px solid rgba(255, 255, 255, 0);
                text-align: center;
                padding-bottom: 5px;
                align-self: center;
            }

            .grid-container-2 {
                display: grid;
                grid-template-columns: auto auto auto;
                padding: 10px;
                margin: 20px;
            }

            @media (max-width: 1200px) {
                .grid-container-2 {
                    grid-template-columns: repeat(3, 1fr);
                    /* 5 columns for large screens */
                }

            }

            @media (max-width: 900px) {
                .grid-container-2 {
                    grid-template-columns: repeat(2, 1fr);
                    /* 3 columns for medium screens */
                }

            }

            @media (max-width: 600px) {
                .grid-container-2 {
                    grid-template-columns: repeat(1, 1fr);
                    /* 2 columns for small screens */
                }

            }

            @media (max-width: 400px) {
                .grid-container-2 {
                    grid-template-columns: 1fr;
                    /* 1 column for very small screens */
                }
            }

            body {
                background-color: #d7c7e7;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 1%;
                margin-left: 2%;
                margin-right: 2%;
                padding: 10px;
            }

            .window {
                width: 1300px;
                height: 800px;
                background: #ffb6c1;
                border: 4px solid #ff69b4;
                border-radius: 5px;
                box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
                display: flex;
                flex-direction: column;
                position: relative;
            }

            @media screen and (max-width:800px) {
                .window {
                    width: 600px;

                }

                .content {
                    flex-direction: column;

                }

                .leftmargin {
                    height: max-content;
                    border-bottom: 5px solid #ffb6c1;
                }
            }

            @media screen and (max-width:600px) {
                .window {
                    flex-direction: column;
                    width: 400px;
                }

                .leftmargin {
                    height: max-content;
                    border-right: none;
                    border-bottom: 5px solid #ffb6c1;
                    ;
                }

            }


            @media screen and (max-height:800px) {
                .window {
                    height: 620px;
                    flex-direction: column;
                    padding: 0px;
                }

            }

            .title-bar {
                background: #ff69b4;
                padding: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: white;
                font-family: Arial, sans-serif;
                font-size: 14px;
            }

            .buttons {
                display: flex;
                gap: 7px;
            }

            .button {
                width: 12px;
                height: 12px;
                background: white;
                border: 1px solid #ff1493;
                border-radius: 50%;
            }

            .address-bar {
                background: white;
                margin: 6px;
                padding: 3px;
                border: 2px inset #ff69b4;
                font-family: Arial, sans-serif;
                letter-spacing: 1px;
            }

            .content {
                flex-grow: 1;
                background: white;
                margin: 6px;
                border: 2px inset #ff69b4;
                overflow: hidden;
                display: flex;
            }

            .scrollbar {
                width: 10px;
                background: #ffb6c1;
            }

            .span {
                font-size: 25px;

            }

            .leftmargin {
                margin: 0px;
                display: flex;
                flex-direction: column;
                position: relative;
                border: 2px inset #ff69b4;
                border-right: none;
            }

            .folderlinks {
                font-size: 105%;
                text-decoration: none;
                color: rebeccapurple;
                font-family: Arial, sans-serif;
            }

            .folder_icons {
                width: 25px;
                padding-right: 10px;
                transform: translatey(-3px);
            }

            .folder_div {
                display: flex;
                align-items: center;
                /*gap: 10px;*/
                padding: 10px;
                padding-left: 20px;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .rightmargin {
                width: 100%;
                overflow-y: auto;
                border: 2px inset #ff69b4;
                border-left: 4px inset #ff69b4;
            }

            h1 {
                font-family: Arial, sans-serif;
                color: rebeccapurple;
            }

            h2 {
                font-family: Arial, sans-serif;
                color: rebeccapurple;
            }

            h3 {
                font-family: Arial, sans-serif;
                color: rebeccapurple;
            }

            ul {

                color: rebeccapurple;
            }

            p {
                font-family: Arial, sans-serif;
                color: rebeccapurple;
                font-size: 110%;
                line-height: 1.5;
            }

            .bulletpoints {
                list-style-type: circle;
                display: block;
            }

            .folder-desc {
                margin: 0px 0px;

            #currenttab {

                /*border: 2.5px solid #7a99e8;*/

            }

            #inactivetab {
                background-color: white;
                /*border:2.5px solid white;*/
            }
        </style>
        <script>
            function highlightInactiveFolder(x) {
                if (x.id = "inactivetab") {
                    x.style.background = "#e8f2fe";
                    //x.style.border = "2.5px solid #e3f1ff";
                }
            }
            function highlightActiveFolder(x) {
                if (x.id = "currenttab") {
                    x.style.background = "#a8d2ff";
                    //x.style.border = "2.5px solid #6087eb";

                }
            }
            function unhighlightInactiveFolder(x) {
                if (x.id = "inactivetab") {
                    x.style.background = "white";
                    //x.style.border = "2.5px solid white";
                }
            }
            function unhighlightActiveFolder(x) {
                if (x.id = "currenttab") {
                    x.style.background = "#c3defa";
                    //x.style.border= "2.5px solid #7a99e8";
                }
            }

            var flowerImages = ['images/UI UX/Home.png', 'images/UI UX/Menubar.png', 'images/UI UX/Product List.png', 'images/UI UX/Scroll.png'];
            var flowerIndex = 0;

            function updateFlowerImage() {
                const flowerImage = document.getElementById('flower-image');
                var heightOfArea = document.getElementById('imageArea');
                var arrowL = document.getElementById('arrowL');
                var arrowR = document.getElementById('arrowR');
                flowerImage.setAttribute('src', flowerImages[flowerIndex]);
                if (flowerIndex == 3) {
                    heightOfArea.style.margin = "120px 0px 120px";


                    arrowL.style.transform = "translateY(-50px)";
                    arrowR.style.transform = "translateY(-50px)";

                } else {
                    var heightOfArea = document.getElementById('imageArea');
                    heightOfArea.style.margin = "0px";
                    arrowL.style.transform = "translateY(-180px)";
                    arrowR.style.transform = "translateY(-180px)";

                }
            }

            function prevImage(index) {
                flowerIndex = (flowerIndex - 1 + flowerImages.length) % flowerImages.length;
                updateFlowerImage();

            }
            function nextImage(index) {
                flowerIndex = (flowerIndex + 1) % flowerImages.length;
                updateFlowerImage();
            }
        </script>
